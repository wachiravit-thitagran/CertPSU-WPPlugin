name: Release

# Auto-release on every push to main. The dev workflow is: edit code, push.
# This job computes the next version, stamps it into both plugins,
# builds the zips, and publishes a GitHub Release.
#
# Versioning: the PATCH number is auto-bumped from the latest git tag. To release
# a new MAJOR/MINOR, bump the Version header in
# plugins/certpsu-connector/certpsu-connector.php manually and push.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          current=$(grep -iE '^[[:space:]]*\*?[[:space:]]*Version:' plugins/certpsu-connector/certpsu-connector.php | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || true)
          echo "header=${current:-none}  latest_tag=${latest_tag:-none}"

          if [ -z "${latest_tag}" ]; then
            next="${current:-0.1.0}"
          else
            higher=$(printf '%s\n%s\n' "$current" "$latest_tag" | sort -V | tail -1)
            if [ -n "$current" ] && [ "$higher" = "$current" ] && [ "$current" != "$latest_tag" ]; then
              next="$current"
            else
              IFS=. read -r MA MI PA <<< "$latest_tag"
              next="${MA}.${MI}.$((PA + 1))"
            fi
          fi

          if ! printf '%s' "$next" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Computed version '$next' is not valid semver; aborting." >&2
            exit 1
          fi

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (tag v$next)"

      - name: Set up PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, wp-cli

      - name: Install runtime dependencies (Action Scheduler)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Stamp version into both plugins
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          # Plugin headers.
          sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:[[:space:]]*).*/\1${NEXT}/" plugins/certpsu-connector/certpsu-connector.php
          sed -i -E "s/^([[:space:]]*\*[[:space:]]*Version:[[:space:]]*).*/\1${NEXT}/" plugins/certpsu-tutorlms/certpsu-tutorlms.php
          # Version constants.
          sed -i -E "s/(CERTPSU_CONNECTOR_VERSION', ')[0-9.]+(')/\1${NEXT}\2/" plugins/certpsu-connector/certpsu-connector.php
          sed -i -E "s/(CERTPSU_TUTORLMS_VERSION', ')[0-9.]+(')/\1${NEXT}\2/" plugins/certpsu-tutorlms/certpsu-tutorlms.php

      - name: Build plugin zips
        run: bin/build.sh

      - name: List artifacts
        run: ls -lh dist/

      - name: Validate packaged plugin ZIPs in clean WordPress
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release-wp
          mkdir -p /tmp/release-wp
          cd /tmp/release-wp

          wp core download --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --url=http://localhost --title="Release Validation" --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email --allow-root

          wp plugin install tutor --activate --allow-root

          connector_zip="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*connector*.zip' | head -n1)"
          tutorlms_zip="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name '*tutorlms*.zip' | head -n1)"
          test -n "$connector_zip"
          test -n "$tutorlms_zip"

          wp plugin install "$connector_zip" --activate --force --allow-root
          wp plugin install "$tutorlms_zip" --activate --force --allow-root

          wp plugin is-active certpsu-connector --allow-root
          wp plugin is-active certpsu-tutorlms --allow-root

          test "$(wp plugin get certpsu-connector --field=version --allow-root)" = "$NEXT"
          test "$(wp plugin get certpsu-tutorlms --field=version --allow-root)" = "$NEXT"

          wp plugin deactivate certpsu-tutorlms certpsu-connector --allow-root
          wp plugin activate certpsu-connector certpsu-tutorlms --allow-root

          wp eval 'echo "Packaged CertPSU plugins loaded successfully.\n";' --allow-root

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
